# Admin Platform - Docker Compose配置
# 后端服务: Python (FastAPI) + Go (Gateway/Generator/Deploy)
# 数据库: PostgreSQL 15 + Redis 7

version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    # pgvector 官方镜像：PG15 + vector 扩展，数据目录与 postgres:15-alpine 兼容
    image: pgvector/pgvector:pg15
    container_name: admin-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - admin-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: admin-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - admin-network

  # MySQL 沙箱（4b-2 后端 runner 用）：生成的 Spring Boot 工程连接此实例起服务做活契约审查。
  # 按需启动：docker compose up -d mysql-sandbox（不影响其他服务）。
  mysql-sandbox:
    image: mysql:8.0
    container_name: admin-mysql-sandbox
    restart: unless-stopped
    ports:
      - "43306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: sandbox_root
      MYSQL_DATABASE: sandbox_db
      MYSQL_USER: sandbox
      MYSQL_PASSWORD: sandbox
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_sandbox_data:/var/lib/mysql
    networks:
      - admin-network

  # Python后端服务 (AI Agents)
  admin-python:
    build:
      context: ../admin-python
      dockerfile: Dockerfile
    container_name: admin-python
    restart: always
    env_file:
      - ../admin-python/.env   # 注入 ZAI_API_KEY 等（RAG worker 回填依赖）；DB/REDIS/JWT 仍由下方 environment 覆盖
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/admin_platform
      - REDIS_URL=redis://redis:6379/5
      - JWT_SECRET=admin-platform-jwt-secret-key-2026-dev-only
      - DEBUG=true
      - PIPELINE_PREVIEW_API_PROXY=https://malladmin-jdagent.hctest.tech
      - PIPELINE_EXECUTION_CONCURRENCY=8
      - PIPELINE_EXECUTION_QUEUE_LIMIT=50
    depends_on:
      - postgres
      - redis
    volumes:
      - pipeline_data:/data/pipelines
      - ../admin-python/app:/app/app   # 源码挂载：宿主改 app/ 后 restart 即生效，免重建镜像；recreate 不丢改动
    networks:
      - admin-network

  # Go网关
  admin-gateway:
    build:
      context: ../admin-gateway
      dockerfile: Dockerfile
    container_name: admin-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - REDIS_HOST=redis
      - JWT_SECRET=admin-platform-jwt-secret-key-2026-dev-only
    depends_on:
      - redis
      - admin-python
    networks:
      - admin-network

  # Go代码生成服务
  admin-generator:
    build:
      context: ../admin-generator
      dockerfile: Dockerfile
    container_name: admin-generator
    restart: always
    ports:
      - "8082:8082"
    environment:
      - GIN_MODE=release
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - admin-network

  # Go部署服务
  admin-deploy:
    build:
      context: ../admin-deploy
      dockerfile: Dockerfile
    container_name: admin-deploy
    restart: always
    ports:
      - "8083:8083"
    environment:
      - GIN_MODE=release
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy_data:/data/deploy
    depends_on:
      - postgres
      - redis
    networks:
      - admin-network

  # React前端 (Nginx)
  admin-frontend:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - admin-gateway
    networks:
      - admin-network

volumes:
  postgres_data:
  redis_data:
  deploy_data:
  pipeline_data:
  mysql_sandbox_data:

networks:
  admin-network:
    driver: bridge
