[project]
name = "admin-eval"
version = "0.1.0"
description = "Security-first Agent evaluation control plane"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiokafka>=0.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E501 长行治理交给格式化器；这里管错误级问题 + import 排序 + 空白
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 惯例：Depends()/Query() 作为参数默认值
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
