apiVersion: v1
kind: Namespace
metadata:
  name: agent-eval
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: eval-compute-quota
  namespace: agent-eval
spec:
  hard:
    requests.cpu: "1000"
    requests.memory: 1Ti
    limits.cpu: "1000"
    limits.memory: 1Ti
    requests.ephemeral-storage: 2Ti
    count/jobs.batch: "1000"
    count/pods: "1000"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: eval-hard-defaults
  namespace: agent-eval
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 4Gi
      defaultRequest:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 4Gi
